plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goldway.tvkiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.goldway.tvkiosk"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 개인 기기 사이드로딩 용도라 debug 키로 서명해 바로 설치 가능하게 한다
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
